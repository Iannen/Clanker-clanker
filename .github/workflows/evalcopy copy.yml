
name: Evalcopy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evalcopy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build eval copy
        run: |
          set -euo pipefail

          mkdir clanker-evalcopy

          tar cf - .clanker content | (cd clanker-evalcopy && tar xf -)

          HISTORY="clanker-evalcopy/.clanker/progress-documentation/project-history.history"
          KEEP_CHARS=12000

          if [[ -f "$HISTORY" ]]; then
            tail -c "$KEEP_CHARS" "$HISTORY" > "${HISTORY}.tmp"
            mv "${HISTORY}.tmp" "$HISTORY"
          fi

          zip -r clanker-evalcopy.zip clanker-evalcopy/

      - name: Publish latest eval release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view eval-latest >/dev/null 2>&1; then
            gh release upload eval-latest clanker-evalcopy.zip --clobber
          else
            gh release create eval-latest clanker-evalcopy.zip \
              --title "Latest LLM Evaluation Copy" \
              --notes "Automatically generated evaluation snapshot of the latest main branch."
          fi
