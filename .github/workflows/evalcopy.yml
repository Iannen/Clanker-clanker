name: Build Eval Copy

on:
  workflow_dispatch:

jobs:
  evalcopy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build eval copy
        run: |
          set -euo pipefail

          mkdir clanker-evalcopy

          # Whitelist: only these repository members are included.
          cp -a .clanker clanker-evalcopy/
          cp -a content clanker-evalcopy/

      - name: Upload eval copy
        uses: actions/upload-artifact@v4
        with:
          name: clanker-evalcopy
          path: clanker-evalcopy/
          if-no-files-found: error