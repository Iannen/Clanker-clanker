name: Build Eval Copy

on:
  workflow_dispatch:

jobs:
  evalcopy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build eval copy
        run: |
          set -euo pipefail

          mkdir clanker-evalcopy

          # Copy folders explicitly using tar to preserve hidden contents
          tar cf - .clanker content | (cd clanker-evalcopy && tar xf -)

      - name: Upload eval copy
        uses: actions/upload-artifact@v5
        with:
          name: clanker-evalcopy
          path: clanker-evalcopy/
          include-hidden-files: true
          if-no-files-found: error