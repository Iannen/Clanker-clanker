shared_base_resolver:
    {anchor: general instructions, type: multi-document-retrieval, files: [general-rules.md]}

pud_filesets:
  content-dir: {includes: [content]}
  empty: {includes: []}
  presentation: {includes: []}

shared_filesets:
  clanker-shared-assets: {includes: [content/a_lib/shared-assets]}

filelists:
  plan_mode: [
    plan-mode.mode_instruction, 
    backlog.output-template, 
    {name: backlog.backlog, from_line: 'Backlog tail, Selected item/items:', up_to: 'Backlog tail end'}
    ]
  do_mode: [
    do-mode.mode_instruction, 
    code-output-instruction.output_instruction, 
    {name: backlog.backlog, from_line: 'Backlog tail, Selected item/items:', up_to: 'Backlog tail end'}
    ]
  doc_migration_mode: [
    doc-management-mode.mode_instruction, 
    {name: project-history.history, tail_lines: 16}, 
    history-output-instructions.output_instruction, 
    {name: backlog.backlog, from_line: 'Backlog tail, Selected item/items:', up_to: 'Backlog tail end'}
    ] 

  backlog_excerpt: [{name: backlog.backlog, from_line: 'Backlog tail, Selected item/items:', up_to: 'Backlog tail end'}]

prompts:
  plan: 
    render:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [backlog.output-template]}
        - { anchor: session instructions, type: multi-document-retrieval, files: [plan-mode.mode_instruction]}
  implement:
    render:
      resolvers:
        - { anchor: repository, type: multi-document-retrieval, files: [code-output-instruction.output_instruction]} 
        - { anchor: session instructions, type: multi-document-retrieval, files: [do-mode.mode_instruction]} 
  document:
    render:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [
              {name: project-history.history, tail_lines: 16},
              history-output-instructions.output_instruction
            ]}
        - {anchor: session instructions, type: multi-document-retrieval, files: [doc-management-mode.mode_instruction]}


shared_domains:
    config-dev:
      resolvers:
        - { anchor: repository, type: repo-content, fileset: ¤ content-dir }
        - { anchor: project documentation, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
      prompts:
        - name: config-dev
          render:
            resolvers:
              - { anchor: session instructions, type: multi-document-retrieval, files: [config-development.mode_instruction, config-style.doctrine] }

    manifest-analysis:
      resolvers:
        - { anchor: session instructions, type: multi-document-retrieval, files: [system_cfg.yaml, shared_cfg.yaml, config.yaml] }
      prompts:
        - name: only m
          render:
            resolvers:
              - { anchor: project documentation, type: repo-manifest, pud_fileset: ¤ content-dir, shared_fileset: ¤clanker-shared-assets }
        - name: core
          render:
            resolvers:
              - { anchor: project documentation, type: multi-document-retrieval, files: [config-development.mode_instruction] }
              - { anchor: repository, type: repo-content, fileset: ¤ content-dir }

    readme:
      resolvers:
        - { anchor: repository, type: repo-content, includes: [README.md] } 
      prompts:
        - name: structure
          render:
            resolvers:
              - { anchor: project documentation, type: multi-document-retrieval, files: [readme.structure_spec] }
              - { anchor: session instructions, type: multi-document-retrieval, files: [readme_structure.mode_instruction] }
        - name: content 
          render:
            resolvers:
              - { anchor: project documentation, type: multi-document-retrieval, files: [readme_messaging.intent] }
              - { anchor: session instructions, type: multi-document-retrieval, files: [readme_content.mode_instruction] }

    north-star:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [north-star.cdoc, backlog.backlog] }
      prompts:
        - name: core
          render:
            resolvers:
              - { anchor: session instructions, type: multi-document-retrieval, files: [north-star-mode.mode_instruction] }
              - { anchor: repository, type: repo-content, fileset: ¤ content-dir }


              

    debloat:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [domain-debloat.md] }
      prompts:
        - name: debloat
          render:
            resolvers:
              - { anchor: session instructions, type: multi-document-retrieval, files: [debloat-instructions.md] }
              - { anchor: repository, type: repo-content, fileset: ¤ content-dir }

    presentation:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [] }
      prompts:
        - name: debloat
          render:
            resolvers:
              - { anchor: repository, type: repo-content, fileset: ¤ presentation }

