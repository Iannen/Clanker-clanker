resolvers:
  base:
    {anchor: base_fragments, type: multi-document-retrieval, files: [general-rules.md]}

shared_base_resolver:
    {anchor: base_fragments, type: multi-document-retrieval, files: [general-rules.md]}

filesets:
  content-dir: {includes: [content]}
  empty: {includes: [], excludes: [.git]}
  clanker-shared-assets: {includes: [content/a_lib/shared-assets]}
  presentation: {includes: []}

filelists:
  plan_mode_instructions: [plan-mode.mode_instruction, backlog-output-instructions.output_instruction]
  do_mode_instructions: [do-mode.mode_instruction, code-output-instruction.output_instruction]
  doc_management_mode_instructions: [doc-management-mode.mode_instruction, {name: project-history.history, tail_lines: 16}, history-output-instructions.output_instruction]
  backlog_at_consultant: [{name: backlog.backlog, from_line: 'Backlog tail, Selected item/items:', up_to: 'Backlog tail end'}]
            
shared_domains:
    manifest-analysis:
      resolvers:
        - { anchor: prompt_fragments, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
      prompts:
        - name: only m
          render:
            resolvers:
              - { anchor: domain_fragments, type: repo-manifest, pud_fileset: content-dir, shared_fileset: clanker-shared-assets }
        - name: core
          render:
            resolvers:
              - { anchor: domain_fragments, type: multi-document-retrieval, files: [config-development-mode.mode_instruction] }
              - { anchor: repo_content, type: repo_content, fileset: content-dir }

    readme:
      resolvers:
        - { anchor: repo_content, type: repo_content, includes: [README.md] } 
      prompts:
        - name: structure
          render:
            resolvers:
              - { anchor: domain_fragments, type: multi-document-retrieval, files: [readme.structure_spec] }
              - { anchor: prompt_fragments, type: multi-document-retrieval, files: [readme_structure.mode_instruction] }
        - name: content 
          render:
            resolvers:
              - { anchor: domain_fragments, type: multi-document-retrieval, files: [readme_messaging.intent] }
              - { anchor: prompt_fragments, type: multi-document-retrieval, files: [readme_content.mode_instruction] }

    north-star:
      resolvers:
        - { anchor: domain_fragments, type: multi-document-retrieval, files: [north-star.cdoc, backlog.backlog] }
      prompts:
        - name: core
          render:
            resolvers:
              - { anchor: prompt_fragments, type: multi-document-retrieval, files: [north-star-mode.mode_instruction] }
              - { anchor: repo_content, type: repo_content, fileset: content-dir }

    config-dev:
      resolvers:
        - { anchor: domain_fragments, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
      prompts:
        - name: config-dev
          render:
            resolvers:
              - { anchor: prompt_fragments, type: multi-document-retrieval, files: [] }
              - { anchor: repo_content, type: repo_content, fileset: content-dir }

    debloat:
      resolvers:
        - { anchor: domain_fragments, type: multi-document-retrieval, files: [domain-debloat.md] }
      prompts:
        - name: debloat
          render:
            resolvers:
              - { anchor: prompt_fragments, type: multi-document-retrieval, files: [debloat-instructions.md] }
              - { anchor: repo_content, type: repo_content, fileset: content-dir }

    presentation:
      resolvers:
        - { anchor: domain_fragments, type: multi-document-retrieval, files: [] }
      prompts:
        - name: debloat
          render:
            resolvers:
              - { anchor: repo_content, type: repo_content, fileset: presentation }

