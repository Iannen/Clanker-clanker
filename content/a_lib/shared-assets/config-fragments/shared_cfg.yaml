base_resolvers:
  - id: base_fragments
    type: multi-document-retrieval
    files: [general-rules.md]

filesets:
  content-dir: {includes: [content]}
  empty: {includes: [], excludes: [.git]}
  clanker-shared-assets: {includes: [content/a_lib/shared-assets]}
  presentation: {includes: []}

filelists:
  plan_mode_instructions: [plan-mode.mode_instruction, backlog-output-instructions.output_instruction]
  do_mode_instructions: [do-mode.mode_instruction, code-output-instruction.output_instruction]
  doc_management_mode_instructions: [doc-management-mode.mode_instruction, {file: project-history.history, tail_lines: 16}, history-output-instructions.output_instruction]

domains:
  - name: manifest-analysis
    resolvers:
      - { id: prompt_fragments, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
    prompts:
      - name: only m
        render:
          resolvers:
            - { id: domain_fragments, type: repo-manifest, pud_fileset: content-dir, shared_fileset: clanker-shared-assets }
      - name: core
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [config-development-mode.mode_instruction] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: readme
    resolvers:
      - { id: repo_content, type: repo_content, includes: [README.md] } 
    prompts:
      - name: structure
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [readme.structure_spec] }
            - { id: prompt_fragments, type: multi-document-retrieval, files: [readme_structure.mode_instruction] }
      - name: content 
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [readme_messaging.intent] }
            - { id: prompt_fragments, type: multi-document-retrieval, files: [readme_content.mode_instruction] }

  - name: north-star
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [north-star.cdoc, backlog.backlog] }
    prompts:
      - name: core
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [north-star-mode.mode_instruction] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: config-dev
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
    prompts:
      - name: config-dev
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: debloat
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [domain-debloat.md] }
    prompts:
      - name: debloat
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [debloat-instructions.md] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: presentation
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [] }
    prompts:
      - name: debloat
        render:
          resolvers:
            - { id: repo_content, type: repo_content, fileset: presentation }

