base_resolvers:
  - id: base_fragments
    type: multi-document-retrieval
    files: [general-rules.md]

filesets:
  all: {includes: [.], excludes: [.git]}
  empty: {includes: [], excludes: [.git]}
  clanker-shared-assets: {includes: [.clanker/shared-assets], excludes: []}

domains:
  - name: config-dev
    resolvers:
      - { id: prompt_fragments, type: multi-document-retrieval, files: [config.yaml, kb_def.yaml, shared_domains.yaml] }
    prompts:
      - name: manifest-analysis
        render:
          resolvers:
            - { id: domain_fragments, type: repo-manifest, pud_fileset: all, shared_fileset: clanker-shared-assets }
            - { id: repo_content, type: repo_content, fileset: core }
      - name: config-dev
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [config-development-mode.md] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: readme
    resolvers:
      - { id: repo_content, type: repo_content, includes: [README.md] } 
    prompts:
      - name: structure
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [readme.structure_spec] }
            - { id: prompt_fragments, type: multi-document-retrieval, files: [readme_structure.analysis_instruction] }
      - name: content 
        render:
          resolvers:
            - { id: domain_fragments, type: multi-document-retrieval, files: [readme_messaging.intent] }
            - { id: prompt_fragments, type: multi-document-retrieval, files: [readme_content.analysis_instruction] }

  - name: north-star
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [north-star.cdoc] }
    prompts:
      - name: core
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: config-dev
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [config.yaml, system_cfg.yaml, shared_cfg.yaml] }
    prompts:
      - name: config-dev
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [config-development-instructions.md] }
            - { id: repo_content, type: repo_content, fileset: core }

  - name: debloat
    resolvers:
      - { id: domain_fragments, type: multi-document-retrieval, files: [domain-debloat.md] }
    prompts:
      - name: debloat
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: [debloat-instructions.md] }
            - { id: repo_content, type: repo_content, fileset: core }