system:
  test_command: "PYTHONPATH=content python3 -B -m unittest discover -s content/test -t content/test -p '*.py' -v"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  old_tui: {includes: [content/a__old_tui]}
  nothing: {includes: []}

  web_clank: 
    includes:
      - content
    excludes:
      - content/a__old_tui

  web_clank_essentials:
    includes:
      - content/clank-server.py
      - content/backend/core
      - content/backend/controller.py
      - content/web-ui/frontend/clanker-app.js
      - content/web-ui/frontend/api-client.js



pud_domains:
  old_tui:
    resolvers:
      - { anchor: repository, type: repo-content, content_fileset: ¤ nothing, meta_fileset: ¤ old_tui }
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document

  web-clank:
    resolvers:
      - { anchor: repository, type: repo-content, content_fileset: ¤ nothing, meta_fileset: ¤ web_clank }
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document