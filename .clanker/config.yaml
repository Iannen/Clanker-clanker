system:
  test_command: "python3 -B test/ship_gate.py"
  apply_command: "echo 'No apply command configured yet.' && true"
  
pud_filesets:
  core: {includes: [content/core]}

  prompt_render: {includes: [content/modules/render_pipeline]}

  asset_ingestion: {includes: [
    content/modules/asset_ingestion,
    content/core/core/entities.py,
    ], excludes: [
      content/modules/asset_ingestion/__init__.py
      ]}

  presentation: {includes: [
    content/core,
    content/clanker.py]}

  report_to_user: {includes: [
    content/core,
    content/modules/keyboard,
    content/modules/render_pipeline,
    content/modules/tui], excludes: [
      content/core/core/exceptions.py,
      content/modules/tui/renderer.py,
    ]}

  kb_prompts_cleanup: { includes: [
    content/core,
    content/modules/keyboard,
    content/modules/tui], excludes: [
    ]}

  frontend: { includes: [content/server/frontend]}
  backend: { includes: [content/server/], excludes: [content/server/frontend]}
  sum: { includes: [content/server/]}

  biggone: { includes: [content], excludes: [content/a_lib]}

pud_domains:
  ingestion:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ asset_ingestion }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode_instructions}
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }

      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_management_mode_instructions}
            - {anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}

  frontend:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ frontend}
      - { anchor: domain_fragments, type: multi-document-retrieval, files: [web-frontent.doctrine]}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  backend:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ backend}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode_instructions}
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_management_mode_instructions}
            - {anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}

  sum:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ sum}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}