#this appears to gravitate towards the filesets of nodes in system being the important bits to declare
# filesets should have a little 'this is such a collection of repo content', which become part of ctx
filesets:
  core: {includes: [
    content/app,
    content/clanker.py,
    content/render_pipeline]}
  ingestion_service: {includes: [
    content/app/entities.py, 
    content/asset_ingestion/ingestion_service.py,
    content/asset_ingestion/commons/error_collector.py,
    content/asset_ingestion/commons/value_extractor.py,
    content/ports_adapters,
    content/app/deps/ingestion.py]}
  cfg_validation: {includes: [
    content/app/entities.py,  
    content/a_lib/shared-assets/config-fragments, 
    .clanker/config.yaml]}
  presentation: {includes: [
    content/app,
    content/clanker.py]}

  move_assets: {includes: [
    content/app/constants.py, 
    content/app/engine.py,
    content/render_pipeline/render_service.py, 
    content/ports_adapters]}

  add_kb_service: {includes: [
    content/app/deps/keyboard.py,
    content/app/engine.py,
    content/app/entities.py,
    content/app/services/keyboard_service.py,
    content/asset_ingestion/assemblers/rtc.py,
    content/asset_ingestion/ingestion_service.py,
    content/clanker.py]}

domains:
- name: core
  resolvers:
    - { id: repo_content, type: repo_content, fileset: core } 

  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.md, backlog-output-instructions.md] }
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: II. Items to refine & QC, up_to: III. Slated for implementation}]}
    - name: bl-impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [do-mode.md, code-output-instruction.md]}
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: III. Slated for implementation:, up_to: IV. Recently implemented}]}

    - name: bl-drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.md, {file: project-history.cdoc, tail_lines: 8}, history-output-instructions.md]}
          - {id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: IV. Recently implemented, up_to: V. Critical bugs}]}

- name: ingestion
  resolvers:
    - { id: repo_content, type: repo_content, fileset: ingestion_service }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.md, backlog-output-instructions.md] }
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: II. Items to refine & QC, up_to: III. Slated for implementation}]}
    - name: bl-impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [do-mode.md, code-output-instruction.md]}
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: III. Slated for implementation:, up_to: IV. Recently implemented:}]}

    - name: bl-drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.md, {file: project-history.cdoc, tail_lines: 15}, history-output-instructions.md]}
          - {id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: IV. Recently implemented, up_to: V. Critical bugs}]}

- name: cfg_validation
  resolvers:
    - { id: repo_content, type: repo_content, fileset: cfg_validation }
    - { id: domain_fragments, type: multi-document-retrieval, files: [backlog.cdoc], }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.md, backlog-output-instructions.md] }
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: II. Items to refine & QC, up_to: III. Slated for implementation}]}
    - name: bl-impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [do-mode.md, code-output-instruction.md]}
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: III. Slated for implementation:, up_to: IV. Recently implemented:}]}
    - name: bl-drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.md, {file: project-history.cdoc, tail_lines: 8}, history-output-instructions.md]}
          - {id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: IV. Recently implemented, up_to: V. Critical bugs}]}
