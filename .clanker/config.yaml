sets:
  core: {includes: [clanker.py, models.py], excludes: []}

domains:
- name: script-dev
  resolvers:
    - { id: repo_content, type: repo_content, fileset: core }
    - { id: domain_fragments, type: multi-document-retrieval, files: [backlog.cdoc], }
    
  renders:
    - name: plan
      resolvers:
        - { id: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.md, backlog-output-instructions.md] }

    - name: bl-impl
      resolvers:
        - {id: prompt_fragments, type: multi-document-retrieval, files: [do-mode.md, code-output-instruction.md]}

    - name: bl-drain
      resolvers:
        - {id: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.md, {file: project-history.cdoc, tail_lines: 8}, history-output-instructions.md]}

- name: north-star
  resolvers:
    - { id: domain_fragments, type: multi-document-retrieval, files: [north-star.md] }
  renders:
    - name: ns-plan
      resolvers:
        - { id: prompt_fragments, type: multi-document-retrieval, files: [] }
        - { id: repo_content, type: repo_content, fileset: core }

- name: config-dev
  resolvers:
    - { id: domain_fragments, type: multi-document-retrieval, files: [config.yaml, kb_def.yaml, shared_domains.yaml] }
  renders:
    - name: config-dev
      resolvers:
        - { id: prompt_fragments, type: multi-document-retrieval, files: [config-development-instructions.md] }
        - { id: repo_content, type: repo_content, fileset: core }

- name: debloat
  resolvers:
    - { id: domain_fragments, type: multi-document-retrieval, files: [domain-debloat.md] }
  renders:
    - name: debloat
      resolvers:
        - { id: prompt_fragments, type: multi-document-retrieval, files: [debloat-instructions.md] }
        - { id: repo_content, type: repo_content, fileset: core }
