kb_def:
  render:
    name: ui
    template: ui_template
    resolvers:
    - {type: kb_info}
  rows:
    domain_row:
      primary: '1234567890'
      secondary: '!"#¤%&/()='
    prompt_row:
      primary: qwer
      secondary: QWER
    action_row:
      primary: asdf
      secondary: ASDF

domains:
- name: script-dev
  plan:
    name: script_development_plan
  renders:
  - name: script-dev
    template: prompt_template
    resolvers:
    - {id: domain_instruction, type: document-retrieval, file: general-rules.md}
    - {id: prompt_instruction, type: document-retrieval, file: 
        script_dev_instructions.md}
    - {id: repo_content, type: repo_content, includes: [clanker.py], excludes: [],
      sorting: normal}
- name: config-dev
  plan:
    name: config_development_plan
  renders:
  - name: config-dev
    template: prompt_template
    resolvers:
    - {id: domain_instruction, type: document-retrieval, file: general-rules.md}
    - {id: prompt_instruction, type: document-retrieval, file: 
        config_development_instructions.md}
    - {id: repo_content, type: repo_content, includes: [clanker.py], excludes: [],
      sorting: normal}
- name: debloat
  plan:
    name: debloat_plan
  renders:
  - name: debloat
    template: prompt_template
    resolvers:
    - {id: domain_instruction, type: document-retrieval, file: general-rules.md}
    - {id: prompt_instruction, type: document-retrieval, file: 
        debloat_instructions.md}
    - {id: repo_content, type: repo_content, includes: [clanker.py], excludes: [],
      sorting: normal}
