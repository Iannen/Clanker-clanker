system:
  test_command: "python3 -B test/ship_gate.py"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  old: {includes: [content], excludes: [content/a_lib]}

  exodus: { includes: [
    content/backend,
    content/clank-server.py,
    content/web-ui
    ]}


pud_domains:
  old:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ old}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  exodus:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ exodus }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }