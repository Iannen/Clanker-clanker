system:
  test_command: "python3 -B test/ship_gate.py"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  old_tui: {includes: [content/a__old_tui], excludes: [content/a_lib]}

  server: { 
    includes: [content],
      excludes: [
        content/a__old_tui,
        content/a_lib,
        content/backend/adapters
    ]}

  debug: {
    includes: [
      content/backend,
      content/web-ui/frontend/api-client.js,
      content/web-ui/frontend/sidepanel-left.js,
      content/clank-server.py,
      content/gpu-box-server-copy
    ]
  }

pud_domains:
  old:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ old_tui}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  server:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ server }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }


  debug:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ debug }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }