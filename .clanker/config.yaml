system:
  test_command: "python3 -B test/ship_gate.py"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  all_code: {includes: [content], excludes: [
    content/a_lib,
    content/adapters/terminal/scripted_terminal_adapter.py,
    ]}

  backend: { includes: [content], excludes: [
    content/a_lib,
    content/adapters/terminal/scripted_terminal_adapter.py,
    content/web-ui/frontend,
    ]}

  frontend: {includes: [content], excludes: [
    content/a_lib,
    content/adapters/terminal/scripted_terminal_adapter.py,
    content/adapters,
    content/modules/asset_ingestion,    
  ]}


pud_domains:
  all_code:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ all_code}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  backend:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ backend }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }

      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  frontend:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ frontend }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }