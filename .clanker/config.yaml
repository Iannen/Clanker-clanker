system:
  test_command: "python3 -B content/test/ship_gate.py"

filesets:
  core: {includes: [
    content/core,
    content/clanker.py,
    content/modules/asset_ingestion/ingestion_service.py,
    content/modules/asset_ingestion/commons/error_collector.py]}

  asset_ingestion: {includes: [content/modules/asset_ingestion]}

  cfg_validation: {includes: [
    content/core/entities.py,  
    content/a_lib/shared-assets/config-fragments, 
    .clanker/config.yaml]}

  presentation: {includes: [
    content/core,
    content/clanker.py]}

  ports_adapters: {includes: [
    content/ports_adapters]}

  test_harness: {includes: [
    content/clanker.py,
    content/adapters/terminal/scripted_terminal_adapter.py,
    content/test], excludes: [
      content/test/reports,
      content/test/sandboxes,
      content/test/test_repos,
      content/test/save.py,
      content/test/import_checker.py,
      content/test/reporter.py,
      content/test/ship_gate.py
    ]}

  path_fix: {includes: [
    content/core/core/constants.py,
    content/modules/asset_ingestion/ingestion_service.py,
    content/modules/asset_ingestion/assemblers/rtc.py,
    content/modules/render_pipeline/render_service.py]}

domains:
- name: core
  resolvers:
    - { id: repo_content, type: repo_content, fileset: path_fix } 

  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

- name: ingestion
  resolvers:
    - { id: repo_content, type: repo_content, fileset: asset_ingestion }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}

- name: test
  resolvers:
    - { id: repo_content, type: repo_content, fileset: test_harness}
    #- { id: base_fragments, type: multi-document-retrieval, files: [test.doctrine] }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
