filesets:
  core: {includes: [
    content/app,
    content/clanker.py,
    content/test/assert_classes.py]}

  asset_ingestion: {includes: [
    content/app/deps/ingestion.py,
    content/app/engine.py,
    content/app/entities.py,
    content/asset_ingestion/assemblers/rtc.py,
    content/asset_ingestion/commons/error_collector.py,
    content/asset_ingestion/extractors/ui_render.py]}

  cfg_validation: {includes: [
    content/app/entities.py,  
    content/a_lib/shared-assets/config-fragments, 
    .clanker/config.yaml]}

  presentation: {includes: [
    content/app,
    content/clanker.py]}

  ports_adapters: {includes: [
    content/ports_adapters]}

  test_harness: {includes: [
    content/app/engine.py,
    content/clanker.py,
    content/ports_adapters/terminal/scripted_terminal_adapter.py,
    content/test]}

  rationalize_renderservice: {includes: [
    content/asset_ingestion/ingestion_service.py,
    content/asset_ingestion/extractors/domains.py,
    content/asset_ingestion/validators/file_list.py]}

domains:
- name: core
  resolvers:
    - { id: repo_content, type: repo_content, fileset: rationalize_renderservice } 

  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.md, backlog-output-instructions.md] }
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: II. Items to refine & QC, up_to: III. Slated for implementation}]}
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [do-mode.md, code-output-instruction.md]}
          - { id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: III. Slated for implementation:, up_to: IV. Recently implemented}]}

    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.md, {file: project-history.cdoc, tail_lines: 16}, history-output-instructions.md]}
          - {id: domain_fragments, type: multi-document-retrieval, files: [{file: backlog.cdoc, from_line: IV. Recently implemented, up_to: V. Bugs}]}

- name: ingestion
  resolvers:
    - { id: repo_content, type: repo_content, fileset: asset_ingestion }
  prompts:
