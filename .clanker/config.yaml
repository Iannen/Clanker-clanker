system:
  test_command: "python3 -B test/ship_gate.py"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  combined: {includes: [content], excludes: [
    content/a_lib,
    content/web-ui
    ]}

  whole_thing: { includes: [content]}

  web_ui: { includes: [content/web-ui/frontend]}
  backend: { includes: [content/web-ui/], excludes: [content/web-ui/frontend]}
  biggone: { includes: [content], excludes: [content/a_lib]}
  all_code: {includes: [content], excludes: [
    content/a_lib,
    content/adapters/terminal/scripted_terminal_adapter.py
    ]}


  web_dev: {includes: [content], excludes: [
    content/a_lib,
    content/adapters/terminal,
    content/clanker.py,
    content/core/engine.py,
  ]}

pud_domains:
  all_code:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ all_code}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  combined:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ combined }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }

      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  web-dev:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ web_dev }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }