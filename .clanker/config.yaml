system:
  test_command: "python3 -B content/test/ship_gate.py"

filesets:
  core: {includes: [content/core]}

  asset_ingestion: {includes: [
    content/modules/asset_ingestion/parsers,
    content/core/core/entities.py]}

  cfg_validation: {includes: [
    content/core/entities.py,  
    content/a_lib/shared-assets/config-fragments, 
    .clanker/config.yaml]}

  presentation: {includes: [
    content/core,
    content/clanker.py]}

  test_harness: {includes: [
    content/test], excludes: [
        content/test/reports,
        content/test/sandboxes,
        content/test/test_repos,
        content/test/visitors,
    ]}

  complaint_review: {includes: [
      content/core/engine.py,
      content/core/core,
      content/core/engine_deps/ingestion.py,
      content/modules/asset_ingestion/ingestion_service.py,
      content/modules/asset_ingestion/commons]}

domains:
  core:
    resolvers:
      - { id: repo_content, type: repo_content, fileset: core } 

    prompts:
      - name: plan
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
      - name: impl
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

      - name: drain
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
            - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

  ingestion:
    resolvers:
      - { id: repo_content, type: repo_content, fileset: asset_ingestion }
    prompts:
      - name: plan
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
      - name: impl
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

      - name: drain
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
            - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}

  test:
    resolvers:
      - { id: repo_content, type: repo_content, fileset: test_harness}
    prompts:
      - name: plan
        render:
          resolvers:
            - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
      - name: impl
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
            - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
      - name: drain
        render:
          resolvers:
            - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
            - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
