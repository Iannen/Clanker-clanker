system:
  test_command: "python3 -B test/ship_gate.py"

pud_filesets:
  core: {includes: [content/core]}

  asset_ingestion: {includes: [
    content/modules/asset_ingestion,
    content/core/core/entities.py,
    ]}

  presentation: {includes: [
    content/core,
    content/clanker.py]}

  test_harness: {includes: [
    test], excludes: [
        test/reports,
        test/sandboxes,
        test/test_repos,
        test/visitors,
    ]}

  report_to_user: {includes: [
    content/core,
    content/modules/keyboard,
    content/modules/render_pipeline,
    content/modules/tui], excludes: [
      content/core/core/constants.py,
      content/core/core/exceptions.py,
      content/modules/tui/renderer.py,
    ]}

  kb_prompts_cleanup: { includes: [
    content/core,
    content/modules/keyboard,
    content/modules/tui], excludes: [
      content/core/core/constants.py
    ]}

  biggone: { includes: [content], excludes: [
    test
  ]}

pud_domains:
  report_to_user:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ kb_prompts_cleanup } 

    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode_instructions}
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }

      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_management_mode_instructions}
            - {anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }

  ingestion:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ asset_ingestion }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode_instructions}
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant }

      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_management_mode_instructions}
            - {anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}

  test:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ test_harness}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode_instructions }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode_instructions}
            - { anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_management_mode_instructions}
            - {anchor: domain_fragments, type: multi-document-retrieval, files: ¤ backlog_at_consultant}

  repo:
    resolvers:
      - { anchor: repo_content, type: repo-content, fileset: ¤ biggone}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: [] }
            - { anchor: domain_fragments, type: multi-document-retrieval, files: [] }
