filesets:
  core: {includes: [
    content/app,
    content/clanker.py,
    content/test/assert_classes.py]}

  asset_ingestion: {includes: [
    content/app/deps/ingestion.py,
    content/app/engine.py,
    content/app/entities.py,
    content/asset_ingestion/assemblers/rtc.py,
    content/asset_ingestion/commons/error_collector.py,
    content/asset_ingestion/extractors/ui_render.py]}

  cfg_validation: {includes: [
    content/app/entities.py,  
    content/a_lib/shared-assets/config-fragments, 
    .clanker/config.yaml]}

  presentation: {includes: [
    content/app,
    content/clanker.py]}

  ports_adapters: {includes: [
    content/ports_adapters]}

  test_harness: {includes: [
    content/app/engine.py,
    content/app/constants.py,
    content/app/exceptions.py,
    content/app/presentation.py,
    content/clanker.py,
    content/ports_adapters/terminal/scripted_terminal_adapter.py,
    content/test], excludes: [
      content/test/reports,
      content/test/sandboxes,
      content/test/test_repos
    ]}

domains:
- name: core
  resolvers:
    - { id: repo_content, type: repo_content, fileset: core } 

  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

- name: ingestion
  resolvers:
    - { id: repo_content, type: repo_content, fileset: asset_ingestion }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant }

    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}

- name: test
  resolvers:
    - { id: repo_content, type: repo_content, fileset: test_harness }
    - { id: base_fragments, type: multi-document-retrieval, files: [test.doctrine] }
  prompts:
    - name: plan
      render:
        resolvers:
          - { id: prompt_fragments, type: multi-document-retrieval, files: plan_mode_instructions }
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
    - name: impl
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: do_mode_instructions}
          - { id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
    - name: drain
      render:
        resolvers:
          - {id: prompt_fragments, type: multi-document-retrieval, files: doc_management_mode_instructions}
          - {id: domain_fragments, type: multi-document-retrieval, files: backlog_at_consultant}
