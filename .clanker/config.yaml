system:
  test_command: "PYTHONPATH=content python3 -B -m unittest discover -s content/test -t content/test -p '*.py' -v"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  old_tui: {includes: [content/a__old_tui], 
    excludes: [
      content/a_lib,
      content/backend,
      content/test,
      content/web-ui,
      content/clank-server.py]}

  server: { 
    includes: [
#      content/backend/adapters,
      content/backend/asset_ingestion,
      content/backend/core,
      content/backend/render_pipeline,
      content/backend/controller.py,
      content/backend/stdlib.py,
  #    content/test,
      #content/clank-server.py,
      #content/web-ui
    ]}

  front_and_back: {includes: [content], 
    excludes: [
      content/a__old_tui,
      content/a_lib
    ]
  }

  frontend: {includes: ['content/web-ui/frontend']}

  nothing: {includes: []}

pud_domains:
  old_tui:
    resolvers:
      - { anchor: repository, type: repo-content, content_fileset: ¤ old_tui }
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document

  web-clank:
    resolvers:
      - { anchor: repository, type: repo-content, content_fileset: ¤ nothing, meta_fileset: ¤ front_and_back }
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document

  test:
    resolvers:
      - { anchor: repository, type: repo-content, content_fileset: ¤ nothing , meta_fileset: ¤ server}
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document