system:
  #test_command: "python3 -B test/ship_gate.py"
  test_command: "PYTHONPATH=content python3 -B -m unittest discover -s content/test -t content/test -p '*.py' -v"
  apply_command: "echo 'No apply command configured' && true"
  
pud_filesets:
  old_tui: {includes: [content/a__old_tui], excludes: [content/a_lib]}

  server: { 
    includes: [content],
      excludes: [
        content/a__old_tui,
        content/a_lib,
#        content/backend/adapters,
        content/test,
        content/backend/asset_ingestion
    ]}

  test_prompt: {includes: [content/demofile.py]}

prompts:
  plan: 
    render:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [backlog-output-instructions.output_instruction]}
        - { anchor: prompt_fragments, type: multi-document-retrieval, files: [plan-mode.mode_instruction]}
  implement:
    render:
      resolvers:
        - { anchor: repository, type: multi-document-retrieval, files: [code-output-instruction.output_instruction]} 
        - { anchor: prompt_fragments, type: multi-document-retrieval, files: [do-mode.mode_instruction]} 
  document:
    render:
      resolvers:
        - { anchor: project documentation, type: multi-document-retrieval, files: [
              {name: project-history.history, tail_lines: 16},
              history-output-instructions.output_instruction
            ]}
        - {anchor: prompt_fragments, type: multi-document-retrieval, files: [doc-management-mode.mode_instruction]}

pud_domains:
  old:
    resolvers:
      - { anchor: repository, type: repo-content, fileset: ¤ old_tui}
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  server:
    resolvers:
      - { anchor: repository, type: repo-content, fileset: ¤ server }
    prompts:
      - name: plan
        render:
          resolvers:
            - { anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ plan_mode }
      - name: impl
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ do_mode }
      - name: drain
        render:
          resolvers:
            - {anchor: prompt_fragments, type: multi-document-retrieval, files: ¤ doc_migration_mode }

  test_prompt:
    resolvers:
      - { anchor: repository, type: repo-content, fileset: ¤ server }
      - { anchor: project documentation, type: multi-document-retrieval, files: ¤ backlog_excerpt}
    prompts:
      - ¤ plan
      - ¤ implement
      - ¤ document